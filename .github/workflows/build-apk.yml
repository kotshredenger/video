name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk tihiy-pleer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tihiy-pleer-apk
          path: tihiy-pleer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Тихий плеер (последняя сборка)
          files: tihiy-pleer.apk
          make_latest: true
